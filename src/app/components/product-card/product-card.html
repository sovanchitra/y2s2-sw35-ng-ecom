<div class="group cursor-pointer">
  <div class="relative bg-stone-100 rounded-2xl overflow-hidden aspect-[3/4] mb-4">
    <img
      [src]="image()"
      [alt]="title()"
      class="object-cover w-full h-full mix-blend-multiply group-hover:scale-105 transition-transform duration-500"
    />
    @if (badge()) {
      <div class="absolute top-4 left-4">
        <span
          class="backdrop-blur text-xs font-bold px-3 py-1.5 rounded-full shadow-sm"
          [class]="badgeColor()"
          >{{ badge() }}</span
        >
      </div>
    }
    <!-- Quick add button -->
    <div
      class="absolute bottom-4 left-4 right-4 translate-y-12 opacity-0 group-hover:translate-y-0 group-hover:opacity-100 transition-all duration-300"
    >
      <button
        class="w-full bg-white/90 backdrop-blur hover:bg-green-700 hover:text-white text-stone-900 py-3 rounded-xl font-medium transition-colors shadow-lg"
      >
        Quick Add
      </button>
    </div>
  </div>
  <div class="flex justify-between items-start">
    <div>
      <h3 class="font-bold text-stone-900 text-lg group-hover:text-green-700 transition-colors">
        {{ title() }}
      </h3>
      <p class="text-stone-500 text-sm">{{ subtext() }}</p>
    </div>
    <span class="font-medium text-stone-900">{{ price() }}</span>
  </div>
</div>

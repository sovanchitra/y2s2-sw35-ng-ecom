<section class="relative pt-32 pb-20 lg:pt-48 lg:pb-32 overflow-hidden">
  <!-- Decorative background elements -->
  <div
    class="absolute top-0 right-0 -mr-32 -mt-32 w-[600px] h-[600px] bg-green-200/50 rounded-full blur-3xl opacity-50 mix-blend-multiply"
  ></div>
  <div
    class="absolute bottom-0 left-0 -ml-32 -mb-32 w-[500px] h-[500px] bg-amber-100/60 rounded-full blur-3xl opacity-50 mix-blend-multiply pointer-events-none"
  ></div>

  <div class="max-w-7xl mx-auto px-6 relative z-10">
    <div class="grid lg:grid-cols-2 gap-12 items-center">
      <div class="max-w-xl">
        <div
          class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-green-100/80 text-green-800 text-xs font-semibold tracking-wide uppercase mb-6 backdrop-blur-sm border border-green-200"
        >
          <span
            class="w-2 h-2 rounded-full bg-green-500 animate-[pulse_2s_cubic-bezier(0.4,0,0.6,1)_infinite]"
          ></span>
          Spring Collection 2026
        </div>
        <h1
          class="text-5xl lg:text-7xl font-extrabold tracking-tight text-stone-900 leading-[1.1] mb-6"
        >
          Bring
          <span class="text-transparent bg-clip-text bg-gradient-to-r from-green-600 to-emerald-400"
            >Nature</span
          ><br />
          Into Your Home.
        </h1>
        <p class="text-lg text-stone-600 mb-8 leading-relaxed max-w-md">
          Discover our curated collection of indoor plants that purify your air, boost your mood,
          and transform your living space into a serene oasis.
        </p>
        <div class="flex flex-wrap items-center gap-4">
          <button
            class="px-8 py-4 bg-green-700 hover:bg-green-800 text-white rounded-full font-medium transition-all shadow-lg shadow-green-700/30 hover:shadow-green-700/50 hover:-translate-y-1"
          >
            Shop the Collection
          </button>
          <button
            class="px-8 py-4 bg-white hover:bg-stone-50 text-stone-900 rounded-full font-medium transition-all shadow-sm border border-stone-200 flex items-center gap-2 group"
          >
            View Care Guide
            <svg
              class="w-4 h-4 transition-transform group-hover:translate-x-1"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M14 5l7 7m0 0l-7 7m7-7H3"
              />
            </svg>
          </button>
        </div>
      </div>
      <div class="relative">
        <div class="aspect-[4/5] rounded-3xl overflow-hidden relative shadow-2xl">
          <img
            src="https://images.unsplash.com/photo-1485955900006-10f4d324d411?auto=format&fit=crop&q=80&w=1200"
            alt="Beautiful indoor plant"
            class="object-cover w-full h-full transform hover:scale-105 transition duration-700 ease-out"
          />
          <div
            class="absolute inset-0 bg-gradient-to-t from-stone-900/40 to-transparent pointer-events-none"
          ></div>
        </div>
        <!-- Floating badge -->
        <div
          class="absolute -bottom-6 -left-6 bg-white p-4 rounded-2xl shadow-xl flex items-center gap-4 border border-stone-100 animate-[bounce_3s_infinite]"
        >
          <div
            class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center text-green-700"
          >
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 13l4 4L19 7"
              />
            </svg>
          </div>
          <div>
            <p class="text-sm font-bold text-stone-900">Guaranteed</p>
            <p class="text-xs text-stone-500">Healthy Delivery</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
